<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Customer App</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="box">
  <h2 th:text="${isEdit} ? 'Edit Customer' : 'Add Customer'"></h2>

  <form th:action="@{/save}" method="post" th:object="${customerForm}">
    <input type="hidden" th:field="*{id}"/>

    <div class="row">
      <div class="field">
        <label>Name</label>
        <input type="text" th:field="*{name}" required />
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" th:field="*{email}" required />
      </div>

      <div class="field">
        <label>Phone</label>
        <input type="text" th:field="*{phone}" required />
      </div>
    </div>

    <div style="margin-top: 12px;" class="actions">
      <button type="submit" th:text="${isEdit} ? 'Update' : 'Add'"></button>
      <a th:if="${isEdit}" th:href="@{/}">
        <button type="button">Cancel</button>
      </a>
    </div>
  </form>

  <h3 style="margin-top: 20px;">Customer Records</h3>

  <table>
    <thead>
    <tr>
      <th style="width: 60px;">ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th style="width: 180px;">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${customers}">
      <td th:text="${c.id}"></td>
      <td th:text="${c.name}"></td>
      <td th:text="${c.email}"></td>
      <td th:text="${c.phone}"></td>
      <td>
        <div class="actions">
          <a th:href="@{/edit(id=${c.id})}">
            <button type="button">Edit</button>
          </a>

          <form th:action="@{/delete}" method="post" style="display:inline;">
            <input type="hidden" name="id" th:value="${c.id}"/>
            <button class="danger" type="submit" onclick="return confirm('Delete this customer?');">
              Delete
            </button>
          </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
